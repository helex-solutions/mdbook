# One generic mdbook image, content from a volume — the same image serves every
# installation; a site is a directory you mount.
services:
  docs:
    image: ghcr.io/helex-solutions/mdbook:latest
    container_name: mdbook-docs
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"        # nginx in front terminates TLS
    volumes:
      - /srv/docs/mysite:/site:ro    # drop :ro if MDBOOK_BUILD is set
    environment:
      # Build on start instead of mounting a pre-built dist (small sites, demos).
      # MDBOOK_BUILD: "1"
      #
      # Authentication (see docs/auth-design.md). Config may name these directly;
      # env lets one image serve dev and prod unchanged.
      # AUTH_OIDC_AUTHORITY: https://sso.example.org/realms/htx
      # AUTH_OIDC_CLIENT_ID: owlexicon
      # AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      TZ: UTC
      # PDF export talks to the md2pdf service below. It is named in
      # .mdbook/config.yml (`pdf.server: http://md2pdf:18509`); naming it is
      # what enables the feature.
      # MD2PDF_TOKEN: ${MD2PDF_TOKEN}

  # Optional — only needed for PDF export (README "PDF export").
  # Its own image because a PDF needs a layout engine: this one carries Chromium
  # and the Noto/DejaVu fonts, which the docs image deliberately does not.
  md2pdf:
    image: ghcr.io/helex-solutions/md2pdf:latest
    container_name: mdbook-md2pdf
    restart: unless-stopped
    # NO published port. Only `docs` needs to reach it, over the compose network,
    # and the renderer should not be on the internet.
    environment:
      # MD2PDF_TOKEN: ${MD2PDF_TOKEN}   # require a bearer token
      MD2PDF_CONCURRENCY: "2"           # renders in flight; the rest queue
      TZ: UTC
