name: Docker image

# The image is a release artifact — one generic runtime that every installation
# pulls — so publishing stays a deliberate act. Pushing a version tag IS that
# act, and is what the README's release recipe tells you to do, so a tag builds
# and publishes on its own. Everything else is manual: dispatch from the ref you
# want built.
#
# This closes a gap that shipped: v1.9.0 was tagged and its README documented the
# image, while the image itself did not exist until someone remembered to run
# this workflow by hand. Anyone following the README in between hit a registry
# 404 for a version the docs said was released.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: the git tag without "v", else <branch>-<short sha>)'
        type: string
        default: ''
      latest:
        description: 'Also publish :latest — README documents the untagged pull, so a release should tick this'
        type: boolean
        default: false
      push:
        description: 'Push to ghcr.io (untick to only build and smoke-test)'
        type: boolean
        default: true
      platforms:
        description: 'Target platforms — arm64 is emulated, so dropping it roughly halves the build'
        type: choice
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
        default: linux/amd64,linux/arm64

jobs:
  image:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_LATEST: ${{ inputs.latest }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          image=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')  # ghcr rejects uppercase
          tag=$INPUT_TAG
          if [ -z "$tag" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              tag=${GITHUB_REF_NAME#v}
            else
              tag="$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-')-$(git rev-parse --short HEAD)"
            fi
          fi
          case $tag in
            [!A-Za-z0-9_]* | *[!A-Za-z0-9_.-]*)
              echo "::error::'$tag' is not a valid image tag" >&2; exit 1 ;;
          esac
          # :latest is what an untagged `docker pull` gets, and the README documents
          # that pull — so a release tag moves it. A pre-release must not: v2.0.0-rc1
          # is exactly the version nobody should get by accident.
          if [ "$EVENT" = workflow_dispatch ]; then
            latest=$INPUT_LATEST
          elif printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            latest=true
          else
            latest=false
          fi
          tags="$image:$tag"
          if [ "$latest" = true ]; then tags="$tags,$image:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Publishing: $tags"

      # Only the multi-platform push needs emulation; installing binfmt is
      # cheap enough not to bother making it conditional.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Build for this runner's architecture first and keep it locally, so the
      # smoke test below exercises a real image before anything is published.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mdbook:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Dockerfile copies a subset of the tree and drops privileges, so the
      # failure modes worth catching are a missing file and an unwritable volume
      # — both of which only show up when the container actually serves a site.
      - name: Smoke-test the image against demo/
        run: |
          set -eu
          # Run as the runner's own uid, not the image's 10001. Two reasons, both
          # specific to self-hosted runners:
          #   - the workspace PERSISTS between jobs, so anything the container
          #     writes as another uid is undeletable afterwards and the NEXT job
          #     dies in actions/checkout with "EACCES: permission denied, rmdir
          #     demo/.mdbook/dist". A hosted runner gets a fresh VM, so it never
          #     shows up there.
          #   - the original `sudo chown -R 10001:10001` cannot work here anyway:
          #     these runners give the runner no passwordless sudo.
          # Owning the output as the runner makes both problems disappear, and no
          # chmod is needed since the runner already owns the checkout.
          #
          # The container is detached, and the same persistence means nothing
          # reaps it after the job — a hosted VM was thrown away, a self-hosted
          # runner keeps it serving until the next run collides with its name
          # and its port. Hence:
          #   - a name per runner, removed up front: that also clears a
          #     container leaked by a cancelled run, and runners sharing one
          #     docker daemon never touch each other's;
          #   - an EXIT trap, so both the exit 0 and the exit 1 below clean up;
          #   - a loopback port docker picks, so a busy 8080 on a shared host
          #     cannot fail the step.
          name="smoke-$RUNNER_NAME"
          page="$RUNNER_TEMP/smoke-home.html"
          docker rm -f "$name" >/dev/null 2>&1 || true
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" -p 127.0.0.1::8080 -e MDBOOK_BUILD=1 \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/demo:/site" mdbook:smoke
          port=$(docker port "$name" 8080/tcp | head -n1)
          port=${port##*:}
          for _ in $(seq 60); do
            if curl -fsS -o "$page" "http://127.0.0.1:$port/" && grep -qi '<title' "$page"; then
              echo "served: $(grep -o '<title>[^<]*' "$page")"
              exit 0
            fi
            [ "$(docker inspect -f '{{.State.Running}}' "$name")" = true ] || break
            sleep 2
          done
          echo '::error::the container never served the demo site'
          docker logs "$name"
          exit 1

      - name: Log in to ghcr.io
        # `inputs.push` is empty on a tag push, and an empty string is falsey —
        # left alone, a release tag would build, smoke-test and publish nothing.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilt rather than retagged: the push may cover platforms the smoke
      # test's single-arch image does not. Layers come from the cache above.
      - name: Push
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
